<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tâche partagée · Schedulock</title>
<style>
  :root { --fond: #f4f6fb; --carte: #ffffff; --texte: #1b1f2a; --doux: #5b6378; --accent: #3355cc; --bord: #dfe3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0f1220; --carte: #1a1f33; --texte: #eef1fa; --doux: #a6aec6; --accent: #8fa8ff; --bord: #2c3350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .doux { color: var(--doux); }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 14px 16px; margin: 12px 0; border-left: 6px solid var(--accent); }
  .carte .titre { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .carte .detail { color: var(--doux); font-size: .9rem; overflow-wrap: anywhere; }
  .bouton { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 14px; border-radius: 999px; margin-top: 24px; }
  @media (prefers-color-scheme: dark) { .bouton { color: #0f1220; } }
  .aide { font-size: .9rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Une tâche pour toi</h1>
  <p class="doux" id="sous-titre">Envoyée avec Schedulock.</p>
  <div id="taches"></div>
  <a class="bouton" id="store" href="https://play.google.com/store/apps/details?id=fr.emploidutemps">Installer Schedulock sur Google Play</a>
  <p class="doux aide" id="aide">Une fois Schedulock installé, touche à nouveau le lien reçu : la tâche s'ouvrira dans l'appli.</p>
</main>
<script>
// Les tâches sont dans l'adresse, après le « # » : cette partie n'est jamais envoyée au site. Tout est affiché comme
// du texte (jamais comme du HTML), avec les mêmes limites que l'appli.
(function () {
  var en = !/^fr/i.test(navigator.language || "");
  var T = en ? {
    une: "A task for you", plusieurs: function (n) { return n + " tasks for you"; }, activite: function (a, n) { return "The activity “" + a + "” (" + n + " tasks)"; },
    sous: "Sent with Schedulock.", store: "Get Schedulock on Google Play", aide: "Once Schedulock is installed, tap the link you received again: the task will open in the app.",
    invalide: "Invalid link", invalideTexte: "This link is damaged or incomplete. Ask the sender to share it again.", limite: "Due ", rappel: "Reminder ",
  } : {
    une: "Une tâche pour toi", plusieurs: function (n) { return n + " tâches pour toi"; }, activite: function (a, n) { return "L'activité « " + a + " » (" + n + " tâches)"; },
    sous: "Envoyée avec Schedulock.", store: "Installer Schedulock sur Google Play", aide: "Une fois Schedulock installé, touche à nouveau le lien reçu : la tâche s'ouvrira dans l'appli.",
    invalide: "Lien invalide", invalideTexte: "Ce lien est abîmé ou incomplet. Demande à l'envoyeur de le partager à nouveau.", limite: "Pour le ", rappel: "Rappel ",
  };
  if (en) document.documentElement.lang = "en";
  function texte(id, t) { document.getElementById(id).textContent = t; }
  texte("sous-titre", T.sous); texte("store", T.store); texte("aide", T.aide);
  function invalide() { texte("titre", T.invalide); texte("sous-titre", T.invalideTexte); }

  var donnees = location.hash.slice(1);
  if (!donnees || donnees.length > 16000 || !/^[A-Za-z0-9_-]+$/.test(donnees) || typeof DecompressionStream === "undefined") { invalide(); return; }
  var b64 = donnees.replace(/-/g, "+").replace(/_/g, "/");
  var octets;
  try { octets = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), function (c) { return c.charCodeAt(0); }); } catch (e) { invalide(); return; }
  var flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  new Response(flux).text().then(function (json) {
    if (json.length > 65536) throw 0;
    var p = JSON.parse(json);
    if (p.v !== 1 || !Array.isArray(p.t) || p.t.length < 1 || p.t.length > 100) throw 0;
    var liste = document.getElementById("taches");
    var couleur = function (c) { return typeof c === "number" ? "#" + ("000000" + (c & 0xFFFFFF).toString(16)).slice(-6) : null; };
    p.t.forEach(function (t) {
      if (typeof t.x !== "string" || !t.x.trim() || t.x.length > 2000) throw 0;
      var carte = document.createElement("div"); carte.className = "carte";
      var c = couleur(t.c) || (p.a && couleur(p.a.c)); if (c) carte.style.borderLeftColor = c;
      var titre = document.createElement("div"); titre.className = "titre"; titre.textContent = t.x.trim(); carte.appendChild(titre);
      var details = [];
      if (typeof t.d === "string") details.push(T.limite + t.d);
      if (typeof t.r === "string") details.push(T.rappel + t.r.replace("T", " "));
      (Array.isArray(t.l) ? t.l.slice(0, 20) : []).forEach(function (l) { if (typeof l === "string") details.push(l.slice(0, 200)); });
      details.forEach(function (d) { var e = document.createElement("div"); e.className = "detail"; e.textContent = d; carte.appendChild(e); });
      liste.appendChild(carte);
    });
    var nom = p.a && typeof p.a.n === "string" ? p.a.n.slice(0, 60) : null;
    texte("titre", nom ? T.activite(nom, p.t.length) : p.t.length === 1 ? T.une : T.plusieurs(p.t.length));
  }).catch(invalide);
})();
</script>
</body>
</html>
